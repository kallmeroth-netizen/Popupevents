<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F1E9">
<title>Neighborly · Your bar tasting notes</title>
<meta name="description" content="Neighbors Only. Your bar tasting notes.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<style>
  @font-face{font-family:"Futura Neighborly";src:url(/fonts/FuturaCyrillicDemi.ttf) format("truetype");font-weight:600;font-display:swap}
  @font-face{font-family:"Tuppence";src:url(/fonts/Tuppence-Variable.otf) format("opentype");font-weight:100 900;font-display:swap}
  @font-face{font-family:"TAYA Maya";src:url(/fonts/TAYAmaya.otf) format("opentype");font-weight:400;font-display:swap}
  @font-face{font-family:"DM Sans";src:url(/fonts/dm-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"DM Sans";src:url(/fonts/dm-sans-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
  :root{
    --ink:#1E2329; --text:#3A4049; --muted:#6B7280; --faint:#A8ADB5;
    --orange:#E87242; --orange-deep:#C25A30; --blush:#FDF3EC; --lav:#CBC9D6;
    --page:#FFFFFF; --bar:#F5F1E9; --panel:#F5F2EB; --field:#FAF6F0; --line:#E6E2DA; --err:#C0473A;
    --futura:"Futura Neighborly","Futura PT",sans-serif; --taya:"TAYA Maya","Oswald",sans-serif; --tup:"Tuppence",Georgia,serif; --body:"Telegraf","DM Sans","Neue Haas Grotesk","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow-x:clip}
  /* site chrome, same as the ticket */
  .hdr{position:sticky;top:0;z-index:20;background:rgba(245,241,233,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .hdr-in{max-width:1180px;margin:0 auto;padding:clamp(10px,2.4vw,14px) clamp(16px,3vw,24px);display:flex;align-items:center;justify-content:center}
  .hdr img{height:clamp(22px,5vw,30px);width:auto;display:block}
  main{flex:1;width:100%;max-width:460px;margin:0 auto;padding:0 20px 48px}
  .ftr{border-top:1px solid var(--line);background:var(--bar)}
  .ftr-in{max-width:1180px;margin:0 auto;padding:16px 24px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .ftr img{height:22px;width:auto;display:block}
  .ftr span{font-size:11px;line-height:1.5;color:var(--faint)}

  /* greeting, like the ticket */
  .greet{padding:42px 0 26px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .greet .g1{font-family:var(--taya);font-size:clamp(36px,11vw,48px);line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
  .greet .g2{font-family:var(--tup);font-weight:400;font-size:clamp(26px,8vw,32px);line-height:1.1;color:var(--ink);margin-top:10px}
  .greet .fine{margin-top:14px}
  .fine{font-family:var(--futura);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  /* the card: one page of the survey at a time */
  .card{background:var(--panel);border-radius:24px;padding:20px 20px 24px}
  .ticket-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
  h1{font-family:var(--taya);font-weight:400;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1;color:var(--ink)}
  .step-count{font-family:var(--futura);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .progress{height:3px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 20px}
  .progress span{display:block;height:100%;background:var(--orange);width:25%;transition:width .35s ease}
  .intro{font-size:15px;line-height:1.55;color:var(--text);margin-bottom:18px}
  .intro p{margin:0 0 6px}
  .intro p:first-child{font-family:var(--futura);font-weight:600;font-size:13px;text-transform:uppercase;color:var(--ink)}
  .q{margin:20px 0 0}
  .q:first-child{margin-top:0}
  .q-label{font-family:var(--futura);font-weight:600;font-size:13px;line-height:1.35;text-transform:uppercase;color:var(--ink);margin:0 0 4px}
  .q-hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.45}
  .req{color:var(--orange)}
  .group-title{font-family:var(--futura);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:14px 0 8px}
  /* cocktail chips, the day chips from the planner */
  #menu{display:flex;flex-direction:column}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .choice{position:relative;appearance:none;cursor:pointer;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-family:var(--futura);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap;transition:border-color .2s,box-shadow .2s,color .2s,background .2s;display:inline-flex;align-items:center;gap:8px}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .box{display:none}
  .choice.on{color:#fff;background:var(--ink);border-color:var(--ink)}
  /* rating scales, the hour windows from the planner */
  .drink{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 4px;margin-bottom:10px}
  .drink-name{font-family:var(--futura);font-weight:600;font-size:14px;text-transform:uppercase;margin:0 0 2px;color:var(--ink)}
  .sub-label{font-size:13px;font-weight:500;color:var(--text);margin:12px 0 8px}
  .scale{display:grid;gap:6px}
  .scale.five{grid-template-columns:repeat(5,1fr)}
  .scale.three{grid-template-columns:repeat(3,1fr)}
  .scale.two{grid-template-columns:1fr 1fr}
  .seg{position:relative}
  .seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
  .seg span{display:flex;align-items:center;justify-content:center;height:42px;border-radius:12px;border:1px solid var(--line);font-family:var(--body);font-weight:500;font-size:14px;transition:background .2s,border-color .2s,color .2s;background:#fff;color:var(--ink)}
  .seg input:checked + span{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg input:focus-visible + span{outline:2px solid var(--orange);outline-offset:2px}
  .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}
  .matrix-row{padding:12px 0 2px}
  .matrix-row .sub-label{margin-top:0}
  textarea{width:100%;font:400 15px/1.5 var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .15s;min-height:88px;resize:vertical}
  textarea:focus{border-color:var(--orange);background:#fff}
  .err{display:none;color:var(--err);font-size:13px;margin-top:10px;line-height:1.4}
  .err.show{display:block}
  /* pills, the ticket's */
  .actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:24px}
  .pill{appearance:none;border:0;cursor:pointer;border-radius:999px;padding:15px 24px;min-width:220px;font-family:var(--futura);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,opacity .2s,transform .15s,box-shadow .2s,border-color .2s}
  .pill:active{transform:scale(.97)}
  .pill.primary{background:var(--orange);color:#fff;box-shadow:0 8px 20px rgba(232,114,66,.28)}
  .pill.primary:hover{background:var(--orange-deep)}
  .pill:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
  a.pill{display:inline-block;text-decoration:none;text-align:center}
  .link{background:none;border:0;font:500 14px var(--body);color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:4px}
  .step{display:none}
  .step.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .wait{display:flex;gap:7px;justify-content:center;padding:40px 0}
  .wait i{width:7px;height:7px;border-radius:50%;background:var(--orange);animation:blink 1s infinite}
  .wait i:nth-child(2){animation-delay:.2s}.wait i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

  /* thank you: the houses land, the line writes itself, a little confetti, then home */
  .done{text-align:center;padding:18px 0 6px;position:relative}
  .done .houses{width:76px;height:auto;display:block;margin:0 auto 16px;animation:land .7s cubic-bezier(.22,1,.36,1) both}
  @keyframes land{from{opacity:0;transform:translateY(-26px) scale(.8)}60%{transform:translateY(4px) scale(1.02)}to{opacity:1;transform:none}}
  .done .g1{font-family:var(--taya);font-size:clamp(34px,10vw,44px);line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);animation:fade .5s ease .35s both}
  .done .g2{font-family:var(--tup);font-weight:400;font-size:clamp(24px,7.5vw,30px);line-height:1.1;color:var(--ink);margin-top:8px;animation:fade .5s ease .6s both}
  .done p{font-size:15px;line-height:1.55;color:var(--text);margin:14px auto 0;max-width:320px;animation:fade .5s ease .85s both}
  .done .home{margin-top:18px;animation:fade .5s ease 1.1s both}
  .done .home .fine{display:block;margin-bottom:10px;color:var(--faint)}
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .confetti i{position:absolute;left:50%;top:38px;width:7px;height:7px;border-radius:2px;opacity:0;animation:pop 1.1s cubic-bezier(.2,.7,.3,1) .25s both}
  @keyframes pop{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
  @media (prefers-reduced-motion:reduce){.step.active,.done .houses,.done .g1,.done .g2,.done p,.done .home{animation:none}.confetti{display:none}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in"><img src="/assets/neighborly-houses-mark.png" alt="Neighborly"></div></header>
<main>
  <div class="greet" id="greet"><span class="g1" id="g1">Hi, neighbor</span><span class="g2">your bar tasting notes.</span><span class="fine">Neighbors Only Preview</span></div>
  <form class="card" id="survey" novalidate>
    <div class="ticket-head"><h1 id="stepTitle">Your Bar Order</h1><span class="step-count" id="stepCount">1 of 4</span></div>
    <div class="progress"><span id="bar"></span></div>
    <div id="steps"><div class="wait" aria-label="Loading"><i></i><i></i><i></i></div></div>
    <div class="actions" id="actions" style="display:none">
      <button type="button" class="pill primary" id="next">Next</button>
      <button type="button" class="link" id="back" style="display:none">Back</button>
    </div>
  </form>
</main>
<footer class="ftr"><div class="ftr-in"><img src="/assets/neighborly-wordmark-dark.png" alt="Neighborly"><span>Neighbors Only Preview · Brentwood, CA</span><span>Your answers go to the Neighborly team only, with your name, so we can thank you properly.</span></div></footer>

<script>
(() => {
  const id = (location.pathname.match(/\/f\/([a-z0-9]+)/i) || [])[1] || new URLSearchParams(location.search).get('id') || '';
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '_');
  const $ = (s) => document.querySelector(s);
  const form = $('#survey'), stepsEl = $('#steps');
  let info = null, cocktails = [], steps = [], cur = 0;
  const selected = new Set();
  const a = { drinks: {}, menu: {}, service: {} };

  function fail(msg) { stepsEl.innerHTML = `<div class="intro"><p>Hmm.</p><p>${esc(msg)}</p></div>`; }

  const scale = (name, values, cls, ends, current) => `<div class="scale ${cls}">${values.map((v) => `<label class="seg"><input type="radio" name="${name}" value="${esc(v)}"${String(current) === String(v) ? ' checked' : ''}><span>${esc(v)}</span></label>`).join('')}</div>${ends ? `<div class="ends"><span>${esc(ends[0])}</span><span>${esc(ends[1])}</span></div>` : ''}`;
  const req = (q) => (q.required ? ' <span class="req">*</span>' : '');

  function build() {
    const first = esc(info.first);
    steps = info.steps.map((st, si) => {
      const sec = document.createElement('section'); sec.className = 'step'; sec.dataset.title = st.title;
      let html = '';
      if (si === 0) html += `<div class="intro"><p>Thank you for joining us</p><p>Your feedback is everything. Two minutes, neighbor to neighbor, and the menu gets better before anyone else sees it.</p></div>`;
      st.questions.forEach((q) => {
        if (q.kind === 'cocktails') {
          html += `<div class="q"><p class="q-label">${esc(q.q)}${req(q)}</p><p class="q-hint">${esc(q.hint)}</p><div id="menu">`;
          for (const [group, items] of Object.entries(info.menu)) {
            html += `<p class="group-title">${esc(group)}</p><div class="chips">` + items.map((n) => `<label class="choice ${selected.has(n) ? 'on' : ''}"><input type="checkbox" value="${esc(n)}" data-drink="${esc(n)}"${selected.has(n) ? ' checked' : ''}><span class="choice-name">${esc(n)}</span></label>`).join('') + '</div>';
          }
          html += `</div><p class="err" data-err="${q.key}">${esc(q.error)}</p></div>`;
        } else if (q.kind === 'drinkRatings') {
          html += `<p class="q-hint" style="margin-top:0">${esc(q.q)}</p><div id="drinks"></div><p class="err" data-err="${q.key}">Please answer every question on this page to continue.</p>`;
        } else if (q.kind === 'matrix') {
          html += `<div class="q"><p class="q-label">${esc(q.q)}${req(q)}</p><p class="q-hint">${esc(q.hint)}</p>${Object.entries(q.rows).map(([k, label]) => `<div class="matrix-row"><p class="sub-label">${esc(label)}</p>${scale(q.key + '.' + k, [1, 2, 3, 4, 5], 'five', null, a[q.key][k])}</div>`).join('')}<p class="err" data-err="${q.key}">Please answer every question on this page to continue.</p></div>`;
        } else if (q.kind === 'text') {
          html += `<div class="q"><p class="q-label">${esc(q.q)}${req(q)}</p><textarea name="${q.key}" placeholder="${esc(q.placeholder || '')}" maxlength="600">${esc(a[q.key] || '')}</textarea><p class="err" data-err="${q.key}">${esc(q.error || 'Please answer every question on this page to continue.')}</p></div>`;
        } else if (q.kind === 'choice') {
          html += `<div class="q"><p class="q-label">${esc(q.q)}${req(q)}</p><div style="margin-top:12px">${scale(q.key, q.options, q.options.length === 2 ? 'two' : 'three', null, a[q.key])}</div><p class="err" data-err="${q.key}">${esc(q.error || 'Please choose an option.')}</p></div>`;
        }
      });
      sec.innerHTML = html;
      return sec;
    });
    const done = document.createElement('section'); done.className = 'step'; done.dataset.title = 'Thank You'; done.id = 'doneStep';
    const bits = Array.from({ length: 18 }, (_, i) => { const ang = (i / 18) * Math.PI * 2, d = 70 + (i % 3) * 26; return `<i style="--x:${Math.round(Math.cos(ang) * d)}px;--y:${Math.round(Math.sin(ang) * d - 20)}px;--r:${(i * 47) % 360}deg;background:${['#E87242', '#CBC9D6', '#1E2329', '#F5C9B3'][i % 4]};animation-delay:${0.25 + (i % 5) * 0.05}s"></i>`; }).join('');
    done.innerHTML = `<div class="done"><div class="confetti" aria-hidden="true">${bits}</div><img class="houses" src="/assets/neighborly-houses-mark.png" alt=""><div class="g1">Thank you, ${first}</div><div class="g2">cheers, neighbor.</div><p>Your notes go straight to our bar team as we finalize the menu. We look forward to serving the entire neighborhood on 11/11.</p><div class="home"><span class="fine" id="homeLine">Taking you home in a moment</span><a class="pill primary" href="https://beneighborly.com" id="homeBtn">Back to Neighborly</a><br><button type="button" class="link" id="again">Change an answer</button></div></div>`;
    steps.push(done);
    stepsEl.innerHTML = ''; steps.forEach((s) => stepsEl.append(s));
    $('#actions').style.display = '';
    renderDrinks();
    show(0);
  }

  function renderDrinks() {
    const rows = info.steps[1].questions[0].rows;
    const order = cocktails.filter((n) => selected.has(n));
    $('#drinks').innerHTML = order.map((n) => {
      const k = slug(n), d = a.drinks[n] || {};
      return `<div class="drink" data-drink="${esc(n)}"><p class="drink-name">${esc(n)}</p>${rows.map((r) => `<p class="sub-label">${esc(r.label)} <span class="req">*</span></p>${r.kind === 'five' ? scale(`drinks.${k}.${r.key}`, [1, 2, 3, 4, 5], 'five', r.ends, d[r.key]) : scale(`drinks.${k}.${r.key}`, r.options, 'three', null, d[r.key])}`).join('')}</div>`;
    }).join('');
  }

  // every control writes straight into `a`
  form.addEventListener('change', (e) => {
    const t = e.target;
    if (t.type === 'checkbox' && t.dataset.drink) {
      const n = t.dataset.drink;
      t.checked ? selected.add(n) : (selected.delete(n), delete a.drinks[n]);
      t.closest('.choice').classList.toggle('on', t.checked);
    } else if (t.type === 'radio') {
      const p = t.name.split('.');
      const v = /^\d$/.test(t.value) ? Number(t.value) : t.value;
      if (p[0] === 'drinks') { const n = cocktails.find((c) => slug(c) === p[1]); if (n) (a.drinks[n] = a.drinks[n] || {})[p[2]] = v; }
      else if (p.length === 2) (a[p[0]] = a[p[0]] || {})[p[1]] = v;
      else a[p[0]] = v;
    }
    steps[cur].querySelectorAll('.err').forEach((el) => el.classList.remove('show'));
  });
  form.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') { a[e.target.name] = e.target.value; steps[cur].querySelectorAll('.err').forEach((el) => el.classList.remove('show')); } });
  form.addEventListener('submit', (e) => e.preventDefault());

  const total = 4;
  let homeTimer = null;
  function show(i) {
    steps[cur].classList.remove('active');
    cur = i;
    steps[cur].classList.add('active');
    $('#stepTitle').textContent = steps[cur].dataset.title;
    const done = cur === total;
    $('#stepCount').textContent = done ? 'Complete' : `${cur + 1} of ${total}`;
    clearTimeout(homeTimer);
    if (done) homeTimer = setTimeout(() => { location.href = 'https://beneighborly.com'; }, 6000);
    $('#bar').style.width = `${Math.min(cur + 1, total) / total * 100}%`;
    $('#back').style.display = cur > 0 && !done ? '' : 'none';
    $('#next').textContent = cur === total - 1 ? (info.answered ? 'Update' : 'Submit') : 'Next';
    $('#actions').style.display = done ? 'none' : '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  const showErr = (key) => { const el = steps[cur].querySelector(`.err[data-err="${key}"]`); if (el) el.classList.add('show'); };
  function valid() {
    const st = steps[cur];
    if (cur === 0) { if (!selected.size) { showErr('drinks'); return false; } return true; }
    let ok = true;
    const names = new Set([...st.querySelectorAll('input[type=radio]')].map((i) => i.name));
    const missingRadio = [...names].find((n) => !st.querySelector(`input[name="${n}"]:checked`));
    const missingText = [...st.querySelectorAll('textarea')].find((t) => t.name !== 'notes' && !t.value.trim());
    if (cur === 1 || cur === 2) { if (missingRadio || missingText) { showErr(cur === 1 ? 'ratings' : missingRadio ? missingRadio.split('.')[0] : missingText.name); ok = false; } }
    if (cur === 3) { if (missingText) { showErr(missingText.name); ok = false; } if (missingRadio) { showErr(missingRadio); ok = false; } }
    return ok;
  }

  async function submit() {
    const btn = $('#next'); btn.disabled = true; btn.textContent = 'Sending';
    try {
      const r = await fetch('/api/survey', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, answers: a }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.field ? 'Something is missing: ' + d.field + '.' : 'That didn’t go through. Try once more.');
      info.answered = true;
      show(total);
    } catch (e) { const el = steps[cur].querySelector('.err'); if (el) { el.textContent = e.message; el.classList.add('show'); } }
    finally { btn.disabled = false; btn.textContent = cur === total - 1 ? 'Submit' : 'Next'; }
  }

  $('#next').addEventListener('click', async () => {
    if (!valid()) return;
    if (cur === 0) renderDrinks();
    if (cur === total - 1) { await submit(); return; }
    show(cur + 1);
  });
  $('#back').addEventListener('click', () => show(cur - 1));
  stepsEl.addEventListener('click', (e) => { if (e.target.id === 'again') { clearTimeout(homeTimer); show(0); } });

  async function boot() {
    if (!id) return fail('This link is missing its ticket. Open the one from your email.');
    try {
      const r = await fetch('/api/survey?id=' + encodeURIComponent(id), { cache: 'no-store' });
      if (r.status === 404) return fail('We couldn’t find that ticket. Open the link from your email.');
      if (!r.ok) throw new Error();
      info = await r.json();
      cocktails = Object.values(info.menu).flat();
      $('#g1').textContent = `Hi, ${info.first}`;
      if (info.answers) {
        Object.assign(a, info.answers);
        a.drinks = { ...(info.answers.drinks || {}) }; a.menu = { ...(info.answers.menu || {}) }; a.service = { ...(info.answers.service || {}) };
        Object.keys(a.drinks).forEach((n) => selected.add(n));
      }
      build();
    } catch { fail('Something went wrong loading this. Give it another try in a moment.'); }
  }
  boot();
})();
</script>
