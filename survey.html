<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F1E9">
<title>Neighborly · Your bar tasting notes</title>
<meta name="description" content="Neighbors Only. Your bar tasting notes.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<style>
  @font-face{font-family:"Futura Neighborly";src:url(/fonts/FuturaCyrillicDemi.ttf) format("truetype");font-weight:600;font-display:swap}
  @font-face{font-family:"Tuppence";src:url(/fonts/Tuppence-Variable.otf) format("opentype");font-weight:100 900;font-display:swap}
  @font-face{font-family:"TAYA Maya";src:url(/fonts/TAYAmaya.otf) format("opentype");font-weight:400;font-display:swap}
  @font-face{font-family:"DM Sans";src:url(/fonts/dm-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"DM Sans";src:url(/fonts/dm-sans-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
  :root{
    --ink:#1E2329; --text:#3A4049; --muted:#6B7280; --faint:#A8ADB5;
    --orange:#E87242; --orange-deep:#C25A30; --lav:#CBC9D6;
    --paper:#F5F1E9; --card:#FFFFFF; --soft:#FBF8F2; --line:#E6E0D4; --err:#B4471F;
    --f-head:"TAYA Maya","Oswald",sans-serif; --f-sub:"Futura Neighborly","Futura PT",sans-serif; --f-accent:"Tuppence",Georgia,serif; --f-body:"Telegraf","DM Sans","Neue Haas Grotesk","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
  body{padding:calc(28px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
  .wrap{max-width:480px;margin:0 auto}
  header{text-align:center;margin-bottom:22px}
  .mark{width:58px;height:auto;display:block;margin:0 auto 14px}
  .tagline{font-family:var(--f-accent);font-weight:300;font-size:30px;line-height:1.1;margin:0 0 12px;letter-spacing:-.01em}
  .pill{display:inline-block;background:var(--orange);color:#fff;font-family:var(--f-sub);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:7px 12px 6px;border-radius:999px}
  .card{background:var(--card);border-radius:22px;padding:26px 22px;box-shadow:0 1px 0 rgba(31,35,40,.04),0 10px 30px -18px rgba(31,35,40,.25)}
  .ticket-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:16px;margin-bottom:18px;border-bottom:1.5px dashed var(--line)}
  h1{font-family:var(--f-head);font-weight:400;font-size:34px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
  .step-count{font-family:var(--f-sub);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:-6px 0 22px}
  .progress span{display:block;height:100%;background:var(--orange);width:25%;transition:width .35s ease}
  .intro p{margin:0 0 10px;font-size:15.5px;line-height:1.55}
  .intro p:first-child{font-weight:600}
  .q{margin:22px 0 0}
  .q:first-child{margin-top:0}
  .q-label{font-weight:600;font-size:15px;line-height:1.4;margin:0 0 4px}
  .q-hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .req{color:var(--orange)}
  .group-title{font-family:var(--f-sub);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
  .choice{position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s;font-family:var(--f-head);font-weight:400;font-size:19px;letter-spacing:.04em;text-transform:uppercase;background:#fff}
  .choice-name{flex:1;line-height:1.15;padding-top:2px}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .box{width:22px;height:22px;border-radius:7px;border:1.5px solid #C9C2B4;flex:none;display:grid;place-items:center;transition:all .15s}
  .box svg{opacity:0;width:13px;height:13px}
  .choice.on{border-color:var(--ink);background:var(--soft)}
  .choice.on .box{background:var(--ink);border-color:var(--ink)}
  .choice.on .box svg{opacity:1}
  .drink{border:1.5px solid var(--line);border-radius:16px;padding:16px 14px;margin-bottom:12px}
  .drink-name{font-family:var(--f-head);font-weight:400;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
  .sub-label{font-size:13px;font-weight:600;margin:14px 0 8px}
  .scale{display:grid;gap:6px}
  .scale.five{grid-template-columns:repeat(5,1fr)}
  .scale.three{grid-template-columns:repeat(3,1fr)}
  .scale.two{grid-template-columns:1fr 1fr}
  .seg{position:relative}
  .seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
  .seg span{display:flex;align-items:center;justify-content:center;height:44px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:15px;transition:all .15s;background:#fff}
  .seg input:checked + span{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg input:focus-visible + span{outline:2px solid var(--orange);outline-offset:2px}
  .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
  .matrix-row{padding:14px 0;border-top:1px solid var(--line)}
  .matrix-row:first-of-type{border-top:0;padding-top:4px}
  .matrix-row .sub-label{margin-top:0}
  textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;transition:border-color .15s;min-height:96px;resize:vertical;line-height:1.45}
  textarea:focus{border-color:var(--ink)}
  .err{display:none;color:var(--err);font-size:13px;font-weight:600;margin-top:10px}
  .err.show{display:block}
  .actions{display:flex;gap:10px;margin-top:26px}
  button{font-family:var(--f-sub);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;height:52px;border:0;cursor:pointer;transition:transform .1s,opacity .15s}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.6;cursor:default}
  .primary{flex:1;background:var(--orange);color:#fff}
  .primary:hover{background:var(--orange-deep)}
  .secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:0 22px}
  .step{display:none}
  .step.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .done{text-align:center;padding:12px 0 6px}
  .done .tagline{font-size:34px;margin-top:6px}
  .done p{font-size:15.5px;line-height:1.55;margin:0 auto;max-width:330px}
  .done .link{display:inline-block;margin-top:18px;background:none;border:0;height:auto;font:500 14px var(--f-body);color:var(--muted);text-decoration:underline;text-underline-offset:2px;letter-spacing:0;text-transform:none}
  .wait{display:flex;gap:7px;justify-content:center;padding:40px 0}
  .wait i{width:7px;height:7px;border-radius:50%;background:var(--orange);animation:blink 1s infinite}
  .wait i:nth-child(2){animation-delay:.2s}.wait i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  footer{text-align:center;margin-top:28px}
  .wordmark{display:block;width:150px;height:auto;margin:0 auto}
  .foot-line{font-family:var(--f-sub);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
  .terms{font-size:11.5px;color:var(--muted);line-height:1.5;margin:12px auto 0;max-width:340px}
  @media (prefers-reduced-motion:reduce){.step.active{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="mark" src="/assets/neighborly-houses-mark.png" alt="Neighborly">
    <p class="tagline">your bar tasting notes.</p>
    <span class="pill">Neighbors Only Preview</span>
  </header>

  <form class="card" id="survey" novalidate>
    <div class="ticket-head">
      <h1 id="stepTitle">Your Bar Order</h1>
      <span class="step-count" id="stepCount">1 of 4</span>
    </div>
    <div class="progress"><span id="bar"></span></div>
    <div id="steps"><div class="wait" aria-label="Loading"><i></i><i></i><i></i></div></div>
    <div class="actions" id="actions" style="display:none">
      <button type="button" class="secondary" id="back" style="display:none">Back</button>
      <button type="button" class="primary" id="next">Next</button>
    </div>
  </form>

  <footer>
    <img class="wordmark" src="/assets/neighborly-wordmark-dark.png" alt="Neighborly">
    <p class="foot-line">Neighbors Only Preview · Brentwood, CA</p>
    <p class="terms">Your answers go to the Neighborly team only, with your name, so we can thank you properly.</p>
  </footer>
</div>

<script>
(() => {
  const id = (location.pathname.match(/\/f\/([a-z0-9]+)/i) || [])[1] || new URLSearchParams(location.search).get('id') || '';
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '_');
  const check = '<svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const $ = (s) => document.querySelector(s);
  const form = $('#survey'), stepsEl = $('#steps');
  let info = null, cocktails = [], steps = [], cur = 0;
  const selected = new Set();
  const a = { drinks: {}, menu: {}, service: {} };

  function fail(msg) { stepsEl.innerHTML = `<div class="intro"><p>Hmm.</p><p>${esc(msg)}</p></div>`; }

  const scale = (name, values, cls, ends, current) => `<div class="scale ${cls}">${values.map((v) => `<label class="seg"><input type="radio" name="${name}" value="${esc(v)}"${String(current) === String(v) ? ' checked' : ''}><span>${esc(v)}</span></label>`).join('')}</div>${ends ? `<div class="ends"><span>${esc(ends[0])}</span><span>${esc(ends[1])}</span></div>` : ''}`;
  const req = (q) => (q.required ? ' <span class="req">*</span>' : '');

  function build() {
    const first = esc(info.first);
    steps = info.steps.map((st, si) => {
      const sec = document.createElement('section'); sec.className = 'step'; sec.dataset.title = st.title;
      let html = '';
      if (si === 0) html += `<div class="intro"><p>Hi, ${first}!</p><p>Thank you for joining us for our bar preview! Your feedback is everything. Please consider taking this two-minute survey.</p></div>`;
      st.questions.forEach((q) => {
        if (q.kind === 'cocktails') {
          html += `<div class="q"><p class="q-label">${esc(q.q)}${req(q)}</p><p class="q-hint">${esc(q.hint)}</p><div id="menu">`;
          for (const [group, items] of Object.entries(info.menu)) {
            html += `<p class="group-title">${esc(group)}</p>` + items.map((n) => `<label class="choice ${selected.has(n) ? 'on' : ''}"><input type="checkbox" value="${esc(n)}" data-drink="${esc(n)}"${selected.has(n) ? ' checked' : ''}><span class="box">${check}</span><span class="choice-name">${esc(n)}</span></label>`).join('');
          }
          html += `</div><p class="err" data-err="${q.key}">${esc(q.error)}</p></div>`;
        } else if (q.kind === 'drinkRatings') {
          html += `<p class="q-hint" style="margin-top:0">${esc(q.q)}</p><div id="drinks"></div><p class="err" data-err="${q.key}">Please answer every question on this page to continue.</p>`;
        } else if (q.kind === 'matrix') {
          html += `<div class="q"><p class="q-label">${esc(q.q)}${req(q)}</p><p class="q-hint">${esc(q.hint)}</p>${Object.entries(q.rows).map(([k, label]) => `<div class="matrix-row"><p class="sub-label">${esc(label)}</p>${scale(q.key + '.' + k, [1, 2, 3, 4, 5], 'five', null, a[q.key][k])}</div>`).join('')}<p class="err" data-err="${q.key}">Please answer every question on this page to continue.</p></div>`;
        } else if (q.kind === 'text') {
          html += `<div class="q"><p class="q-label">${esc(q.q)}${req(q)}</p><textarea name="${q.key}" placeholder="${esc(q.placeholder || '')}" maxlength="600">${esc(a[q.key] || '')}</textarea><p class="err" data-err="${q.key}">${esc(q.error || 'Please answer every question on this page to continue.')}</p></div>`;
        } else if (q.kind === 'choice') {
          html += `<div class="q"><p class="q-label">${esc(q.q)}${req(q)}</p><div style="margin-top:12px">${scale(q.key, q.options, q.options.length === 2 ? 'two' : 'three', null, a[q.key])}</div><p class="err" data-err="${q.key}">${esc(q.error || 'Please choose an option.')}</p></div>`;
        }
      });
      sec.innerHTML = html;
      return sec;
    });
    const done = document.createElement('section'); done.className = 'step'; done.dataset.title = 'Thank You'; done.id = 'doneStep';
    done.innerHTML = `<div class="done"><img class="mark" src="/assets/neighborly-houses-mark.png" alt=""><p class="tagline">cheers, neighbor.</p><p>Thanks for sharing. Your feedback goes straight to our bar team as we finalize the menu. We look forward to serving the entire neighborhood on 11/11.</p><button type="button" class="link" id="again">Change an answer</button></div>`;
    steps.push(done);
    stepsEl.innerHTML = ''; steps.forEach((s) => stepsEl.append(s));
    $('#actions').style.display = '';
    renderDrinks();
    show(0);
  }

  function renderDrinks() {
    const rows = info.steps[1].questions[0].rows;
    const order = cocktails.filter((n) => selected.has(n));
    $('#drinks').innerHTML = order.map((n) => {
      const k = slug(n), d = a.drinks[n] || {};
      return `<div class="drink" data-drink="${esc(n)}"><p class="drink-name">${esc(n)}</p>${rows.map((r) => `<p class="sub-label">${esc(r.label)} <span class="req">*</span></p>${r.kind === 'five' ? scale(`drinks.${k}.${r.key}`, [1, 2, 3, 4, 5], 'five', r.ends, d[r.key]) : scale(`drinks.${k}.${r.key}`, r.options, 'three', null, d[r.key])}`).join('')}</div>`;
    }).join('');
  }

  // every control writes straight into `a`
  form.addEventListener('change', (e) => {
    const t = e.target;
    if (t.type === 'checkbox' && t.dataset.drink) {
      const n = t.dataset.drink;
      t.checked ? selected.add(n) : (selected.delete(n), delete a.drinks[n]);
      t.closest('.choice').classList.toggle('on', t.checked);
    } else if (t.type === 'radio') {
      const p = t.name.split('.');
      const v = /^\d$/.test(t.value) ? Number(t.value) : t.value;
      if (p[0] === 'drinks') { const n = cocktails.find((c) => slug(c) === p[1]); if (n) (a.drinks[n] = a.drinks[n] || {})[p[2]] = v; }
      else if (p.length === 2) (a[p[0]] = a[p[0]] || {})[p[1]] = v;
      else a[p[0]] = v;
    }
    steps[cur].querySelectorAll('.err').forEach((el) => el.classList.remove('show'));
  });
  form.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') { a[e.target.name] = e.target.value; steps[cur].querySelectorAll('.err').forEach((el) => el.classList.remove('show')); } });
  form.addEventListener('submit', (e) => e.preventDefault());

  const total = 4;
  function show(i) {
    steps[cur].classList.remove('active');
    cur = i;
    steps[cur].classList.add('active');
    $('#stepTitle').textContent = steps[cur].dataset.title;
    const done = cur === total;
    $('#stepCount').textContent = done ? 'Complete' : `${cur + 1} of ${total}`;
    $('#bar').style.width = `${Math.min(cur + 1, total) / total * 100}%`;
    $('#back').style.display = cur > 0 && !done ? '' : 'none';
    $('#next').textContent = cur === total - 1 ? (info.answered ? 'Update' : 'Submit') : 'Next';
    $('#actions').style.display = done ? 'none' : '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  const showErr = (key) => { const el = steps[cur].querySelector(`.err[data-err="${key}"]`); if (el) el.classList.add('show'); };
  function valid() {
    const st = steps[cur];
    if (cur === 0) { if (!selected.size) { showErr('drinks'); return false; } return true; }
    let ok = true;
    const names = new Set([...st.querySelectorAll('input[type=radio]')].map((i) => i.name));
    const missingRadio = [...names].find((n) => !st.querySelector(`input[name="${n}"]:checked`));
    const missingText = [...st.querySelectorAll('textarea')].find((t) => t.name !== 'notes' && !t.value.trim());
    if (cur === 1 || cur === 2) { if (missingRadio || missingText) { showErr(cur === 1 ? 'ratings' : missingRadio ? missingRadio.split('.')[0] : missingText.name); ok = false; } }
    if (cur === 3) { if (missingText) { showErr(missingText.name); ok = false; } if (missingRadio) { showErr(missingRadio); ok = false; } }
    return ok;
  }

  async function submit() {
    const btn = $('#next'); btn.disabled = true; btn.textContent = 'Sending';
    try {
      const r = await fetch('/api/survey', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, answers: a }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.field ? 'Something is missing: ' + d.field + '.' : 'That didn’t go through. Try once more.');
      info.answered = true;
      show(total);
    } catch (e) { const el = steps[cur].querySelector('.err'); if (el) { el.textContent = e.message; el.classList.add('show'); } }
    finally { btn.disabled = false; btn.textContent = cur === total - 1 ? 'Submit' : 'Next'; }
  }

  $('#next').addEventListener('click', async () => {
    if (!valid()) return;
    if (cur === 0) renderDrinks();
    if (cur === total - 1) { await submit(); return; }
    show(cur + 1);
  });
  $('#back').addEventListener('click', () => show(cur - 1));
  stepsEl.addEventListener('click', (e) => { if (e.target.id === 'again') show(0); });

  async function boot() {
    if (!id) return fail('This link is missing its ticket. Open the one from your email.');
    try {
      const r = await fetch('/api/survey?id=' + encodeURIComponent(id), { cache: 'no-store' });
      if (r.status === 404) return fail('We couldn’t find that ticket. Open the link from your email.');
      if (!r.ok) throw new Error();
      info = await r.json();
      cocktails = Object.values(info.menu).flat();
      if (info.answers) {
        Object.assign(a, info.answers);
        a.drinks = { ...(info.answers.drinks || {}) }; a.menu = { ...(info.answers.menu || {}) }; a.service = { ...(info.answers.service || {}) };
        Object.keys(a.drinks).forEach((n) => selected.add(n));
      }
      build();
    } catch { fail('Something went wrong loading this. Give it another try in a moment.'); }
  }
  boot();
})();
</script>
</body>
</html>
