<style>
@font-face{font-family:"Futura Neighborly";src:url(https://exclusivepreview.vercel.app/fonts/FuturaCyrillicDemi.ttf) format("truetype");font-weight:600}
@font-face{font-family:"DM Sans";src:url(https://exclusivepreview.vercel.app/fonts/dm-sans-latin-400-normal.woff2) format("woff2");font-weight:400}
</style>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F5F1E9;">
<tr><td align="center" style="padding:36px 16px 40px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
  <tr><td style="padding:0 6px 18px;"><img src="https://exclusivepreview.vercel.app/assets/neighborly-wordmark-dark.png" width="150" alt="Neighborly" style="display:block;width:150px;height:auto;border:0;"></td></tr>
  <tr><td style="background:#FFFFFF;border:1px solid #E6E2DA;border-radius:22px;padding:36px 34px 34px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr><td style="font-family:'Futura Neighborly','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6B7280;font-weight:700;padding-bottom:14px;">Neighbors Only Preview</td></tr>
      <tr><td style="font-family:'Futura Neighborly','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:21px;line-height:1.25;text-transform:uppercase;color:#1E2329;padding-bottom:14px;">{{headline}}</td></tr>
      <tr><td style="font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#3A4049;padding-bottom:28px;">{{intro}}</td></tr>
      <tr><td align="left" style="padding-bottom:22px;">
        <a href="{{survey_link}}" style="display:inline-block;background:#E87242;color:#FFFFFF;text-decoration:none;border-radius:999px;padding:16px 32px;font-family:'Futura Neighborly','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;">Tell us how it was</a>
      </td></tr>
      <tr><td style="font-family:'Futura Neighborly','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#A8ADB5;font-weight:700;">Two minutes. Neighbor to neighbor.</td></tr>
    </table>
  </td></tr>
  <tr><td style="padding:18px 8px 0;font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;line-height:1.55;color:#A8ADB5;">One email, no follow-ups.</td></tr>
</table>
</td></tr></table>
