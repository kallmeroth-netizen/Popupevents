<style>
@font-face{font-family:"Futura Neighborly";src:url(https://exclusivepreview.vercel.app/fonts/FuturaCyrillicDemi.ttf) format("truetype");font-weight:600}
@font-face{font-family:"DM Sans";src:url(https://exclusivepreview.vercel.app/fonts/dm-sans-latin-400-normal.woff2) format("woff2");font-weight:400}
</style>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFFFFF;">
<tr><td align="center" style="padding:0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#FFFFFF;">
  <tr><td style="padding:0;line-height:0;">
    <a href="{{ticket_link}}" style="display:block;text-decoration:none;line-height:0;"><img src="https://exclusivepreview.vercel.app/assets/email/your-ticket-is-ready.jpg" width="600" alt="Your ticket is ready. Open your ticket and tap I'm here when you arrive. Your first drink and your meal are both on us." style="display:block;width:100%;max-width:600px;height:auto;border:0;"></a>
  </td></tr>
  <tr><td style="padding:14px 14px 0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F2F2F2" style="background:#F2F2F2;border-radius:22px;">
      <tr><td align="center" style="padding:28px 24px 0;font-family:'Futura Neighborly','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6B7280;font-weight:700;">Your visit</td></tr>
      <tr><td align="center" style="padding:8px 24px 0;font-family:'Futura Neighborly','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:20px;line-height:1.2;text-transform:uppercase;color:#1E2329;">{{visit_day}}</td></tr>
      <tr><td align="center" style="padding:4px 24px 0;font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;color:#1E2329;">{{visit_window}} &middot; {{location}}</td></tr>
      <tr><td align="center" style="padding:6px 24px 0;font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#6B7280;">{{intro}}</td></tr>
      <tr><td align="center" style="padding:24px 24px 28px;">
        <a href="{{ticket_link}}" style="display:inline-block;background:#E87142;color:#FFFFFF;text-decoration:none;border-radius:999px;padding:17px 40px;font-family:'Futura Neighborly','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;">Open my ticket</a>
      </td></tr>
    </table>
  </td></tr>
  <tr><td align="center" style="padding:22px 28px 0;font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.6;color:#3A4049;">{{plus_one_line}}</td></tr>
  <tr><td align="center" style="padding:10px 28px 28px;font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.6;color:#3A4049;">Need a different time? Open the ticket and tap Change.</td></tr>
  <tr><td align="center" style="padding:0 28px 30px;font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;line-height:1.55;color:#A8ADB5;">Must be 21 or older with a valid government-issued ID to redeem. One per guest. No cash value.</td></tr>
</table>
</td></tr></table>
