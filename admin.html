<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F1E9">
<title>Drink Tickets Admin</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<style>
  @font-face{font-family:"Futura Neighborly";src:url(/fonts/FuturaCyrillicDemi.ttf) format("truetype");font-weight:600;font-display:swap}
  @font-face{font-family:"TAYA Maya";src:url(/fonts/TAYAmaya.otf) format("opentype");font-weight:400;font-display:swap}
  @font-face{font-family:"DM Sans";src:url(/fonts/dm-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"DM Sans";src:url(/fonts/dm-sans-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}

  :root{
    --ink:#1E2329; --text:#3A4049; --muted:#6B7280; --faint:#A8ADB5;
    --orange:#E87242; --orange-deep:#C25A30; --blush:#FDF3EC; --green:#4F8A4F;
    --page:#FFFFFF; --bar:#F5F1E9; --panel:#F5F2EB; --field:#FAF6F0; --line:#E6E2DA; --rule:#F1E7D8; --err:#C0473A;
    --futura:"Futura Neighborly","Futura PT",sans-serif; --taya:"TAYA Maya","Oswald",sans-serif; --body:"Telegraf","DM Sans","Neue Haas Grotesk","Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{background:#FBF9F4}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}

  /* ---------- site chrome, same as beneighborly.gift ---------- */
  .hdr{position:sticky;top:0;z-index:20;background:rgba(245,241,233,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .hdr-in{max-width:1180px;margin:0 auto;padding:clamp(10px,2.4vw,15px) clamp(16px,3vw,24px);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hdr img{height:clamp(14px,3.2vw,23px);width:auto;display:block}
  .nav{display:flex;align-items:center;gap:clamp(4px,1.2vw,8px)}
  .nav span,.nav button{font-family:var(--futura);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(10px,2.8vw,12px);padding:clamp(6px,1.5vw,9px) clamp(10px,2vw,17px);border-radius:999px;border:1px solid transparent;background:none;color:var(--text);cursor:pointer;white-space:nowrap}
  .nav .active{background:var(--ink);color:#FAF6F0}
  main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:clamp(16px,3.5vw,34px) clamp(14px,3vw,24px) clamp(40px,7vw,70px)}
  .wrap{max-width:880px;margin:0 auto;padding-top:clamp(8px,2vw,24px)}
  .ftr{border-top:1px solid var(--line);background:var(--bar)}
  .ftr-in{max-width:1180px;margin:0 auto;padding:20px 24px 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .ftr-l{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .ftr img{height:22px;width:auto;display:block}
  .ftr span{font-size:11px;line-height:1.5;color:var(--faint)}
  .badge{display:inline-flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:12px;color:var(--muted)}
  .badge i{width:7px;height:7px;border-radius:999px;background:var(--green)}

  /* ---------- content ---------- */
  h1{font-family:var(--taya);font-weight:400;line-height:1;font-size:40px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 14px;color:var(--ink)}
  .lead{font-size:17px;line-height:1.55;color:var(--text);margin:0 0 26px;max-width:560px}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 8px 20px rgba(30,35,41,.08)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:18px;margin-bottom:18px}
  .lbl{font-family:var(--futura);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted);margin-bottom:10px}
  input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:15px 16px;color:var(--ink);font-family:var(--body);font-size:16px;outline:none;transition:border-color .15s}
  input::placeholder{color:var(--faint)}
  input:focus{border-color:var(--orange)}
  input.key{font-family:var(--mono);letter-spacing:.08em}
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .row > .grow{flex:1 1 220px;min-width:0}
  .btn{appearance:none;-webkit-tap-highlight-color:transparent;cursor:pointer;border-radius:999px;border:0;font-family:var(--futura);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:14px;padding:15px 24px;white-space:nowrap;transition:background .2s,opacity .2s,border-color .2s}
  .btn.primary{background:var(--orange);color:#fff;box-shadow:0 8px 20px rgba(232,114,66,.28)}
  .btn.primary:hover{background:var(--orange-deep)}
  .btn.primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:none;color:var(--orange-deep);border:1px solid var(--line);padding:13px 24px;font-size:13px}
  .btn.ghost:hover{border-color:var(--orange);background:var(--blush)}
  .btn.sm{padding:8px 14px;font-size:11px;letter-spacing:.1em}
  .err{color:var(--err);font-size:14px;min-height:20px;margin-top:10px}
  .made{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px;display:none}
  .made.show{display:block}
  .made strong{display:block;font-size:14px;color:var(--ink);margin-bottom:6px}
  .made code{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.02em;color:var(--text);word-break:break-all;margin-bottom:12px}
  .made .btns{display:flex;gap:8px;flex-wrap:wrap}
  a.btn{text-decoration:none;display:inline-block}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .stat b{display:block;font-family:var(--futura);font-weight:600;font-size:44px;line-height:1;color:var(--ink);margin-bottom:8px}
  .stat span{font-family:var(--futura);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted)}
  .stat + .stat{border-left:1px solid var(--rule)}
  .loghead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .loghead .lbl{margin:0}
  .x{appearance:none;-webkit-tap-highlight-color:transparent;background:none;border:0;cursor:pointer;color:var(--faint);font:400 18px/1 var(--body);padding:4px 6px;border-radius:8px}
  .x:hover{color:var(--err);background:#FBEFEC}
  .list{display:flex;flex-direction:column}
  .item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule)}
  .item:last-child{border-bottom:0}
  .item .who{flex:1;min-width:0}
  .item .name{font-size:15px;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .sub{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:2px;min-width:0}
  .item .sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .sub i{flex:0 0 auto;width:7px;height:7px;border-radius:999px;background:var(--faint)}
  .item .sub.done{color:var(--green)}
  .item .sub.done i{background:var(--green)}
  .item .muted{font-size:13px;color:var(--muted)}
  .empty{font-size:14px;color:var(--muted);padding:8px 0}
  .clearall{display:block;margin:14px auto 0;background:none;border:0;cursor:pointer;font:400 13px var(--body);color:var(--faint);text-decoration:underline;text-underline-offset:2px}
  .clearall:hover{color:var(--err)}
  .hidden{display:none}
  @media (max-width:520px){
    .hdr{background:rgba(245,241,233,.98);backdrop-filter:none;-webkit-backdrop-filter:none}
    h1{font-size:30px;margin-bottom:8px}
    .lead{font-size:15px;margin-bottom:18px}
    .card{padding:16px;border-radius:16px}
    .grid{gap:12px;margin-bottom:12px}
    .row{flex-wrap:nowrap;align-items:stretch}
    .row > .grow{flex:1 1 0}
    input{padding:12px 14px;font-size:16px}
    .btn.primary{padding:0 18px;font-size:12px;letter-spacing:.1em}
    .made{padding:12px;margin-top:12px}
    .made code{font-size:12px}
    .stat b{font-size:28px;margin-bottom:6px}
    .stat span{font-size:10px}
    .item{padding:10px 0}
    .ftr img{height:16px}
    .badge{display:none}
  }
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <img src="/assets/neighborly-wordmark-dark.png" alt="Neighborly">
    <nav class="nav"><span class="active">Drink Tickets</span></nav>
  </div>
</header>
<main>
  <div class="wrap">
    <h1>Drink Tickets</h1>
    <p class="lead">Create VIP guest unique link</p>

    <div class="card" id="login">
      <div class="lbl">Admin key</div>
      <div class="row"><div class="grow"><input id="key" class="key" type="password" placeholder="Paste your admin key" autocomplete="off"></div><button class="btn primary" id="enter">Enter</button></div>
      <div class="err" id="loginErr"></div>
    </div>

    <div id="app" class="hidden">
      <div class="grid">
        <div class="card">
          <div class="lbl">New ticket for</div>
          <div class="row"><div class="grow"><input id="name" placeholder="Guest first name" maxlength="40" autocomplete="off"></div><button class="btn primary" id="make">Make link</button></div>
          <div class="err" id="makeErr"></div>
          <div class="made" id="made"><strong id="madeFor"></strong><code id="madeUrl"></code><div class="btns"><button class="btn ghost sm" id="copy">Copy link</button><a class="btn ghost sm" id="openLink" target="_blank" rel="noopener">Open</a></div></div>
        </div>
        <div class="card stats">
          <div class="stat"><b id="sTickets">0</b><span>Tickets</span></div>
          <div class="stat"><b id="sRedeemed">0</b><span>Redeemed</span></div>
          <div class="stat"><b id="sDrinks">0</b><span>Drinks</span></div>
        </div>
      </div>

      <div class="card">
        <div class="loghead"><div class="lbl">Log</div><button class="btn ghost sm" id="refresh">Refresh</button></div>
        <div class="list" id="rows"><div class="empty">Loading</div></div>
        <button class="clearall" id="clear">Clear all tickets</button>
      </div>
    </div>
  </div>
</main>
<footer class="ftr">
  <div class="ftr-in">
    <div class="ftr-l">
      <img src="/assets/neighborly-wordmark-dark.png" alt="Neighborly">
      <span>Neighbors Only Preview · Brentwood, CA</span>
      <span>Ticket links are private to each guest. One drink per neighbor, on the house.</span>
    </div>
    <div class="badge"><i></i>Live redemptions</div>
  </div>
</footer>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let key = '';
  try { key = sessionStorage.getItem('nbKey') || ''; } catch {}
  const fmtTime = (ms) => ms ? new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  const api = (method, body, qs) => fetch('/api/tickets' + (qs || ''), { method, headers: { 'Content-Type': 'application/json', 'x-admin-key': key }, body: body ? JSON.stringify(body) : undefined });
  const linkFor = (id) => location.origin + '/t/' + id;
  const copyBtn = (b, url, idle) => { b.onclick = () => navigator.clipboard.writeText(url).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = idle, 1200); }); };

  async function loadLog() {
    const r = await api('GET');
    if (r.status === 401) { throw new Error('unauthorized'); }
    const { tickets } = await r.json();
    const rows = $('#rows'); rows.replaceChildren();
    let red = 0, drinks = 0;
    for (const t of tickets) {
      if (t.redeemed) { red++; drinks += t.qty; }
      const item = document.createElement('div'); item.className = 'item';
      const who = document.createElement('div'); who.className = 'who';
      const name = document.createElement('div'); name.className = 'name'; name.textContent = t.name || '(no name)';
      const sub = document.createElement('div'); sub.className = 'sub' + (t.redeemed ? ' done' : '');
      const subText = document.createElement('span'); subText.textContent = t.redeemed ? ('Redeemed · ' + t.qty + (t.qty === 1 ? ' drink' : ' drinks') + (t.redeemedAt ? ' · ' + fmtTime(t.redeemedAt) : '')) : 'Open';
      sub.append(document.createElement('i'), subText);
      who.append(name, sub);
      const b = document.createElement('button'); b.className = 'btn ghost sm'; b.textContent = 'Copy'; copyBtn(b, linkFor(t.id), 'Copy');
      const x = document.createElement('button'); x.className = 'x'; x.title = 'Delete this ticket'; x.setAttribute('aria-label', 'Delete ' + (t.name || 'ticket')); x.textContent = '\u00d7';
      x.onclick = async () => { if (!confirm('Delete the ticket for ' + (t.name || 'this guest') + '? The link will stop working.')) return; x.disabled = true; try { await api('DELETE', null, '?id=' + t.id); } catch {} loadLog().catch(() => {}); };
      item.append(who, b, x);
      rows.appendChild(item);
    }
    if (!tickets.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No tickets yet. Make one above.'; rows.appendChild(e); }
    $('#clear').style.display = tickets.length ? '' : 'none';
    $('#sTickets').textContent = tickets.length; $('#sRedeemed').textContent = red; $('#sDrinks').textContent = drinks;
  }

  async function enter() {
    key = $('#key').value.trim(); $('#loginErr').textContent = '';
    try { await loadLog(); try { sessionStorage.setItem('nbKey', key); } catch {} $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); }
    catch { $('#loginErr').textContent = 'That key did not work.'; }
  }
  $('#enter').onclick = enter; $('#key').onkeydown = (e) => { if (e.key === 'Enter') enter(); };
  $('#refresh').onclick = () => loadLog().catch(() => {});
  $('#clear').onclick = async () => {
    if (!confirm('Delete every ticket? All existing links will stop working. This cannot be undone.')) return;
    $('#clear').disabled = true;
    try { await api('DELETE', null, '?all=1'); } catch {}
    $('#clear').disabled = false; loadLog().catch(() => {});
  };
  $('#name').onkeydown = (e) => { if (e.key === 'Enter') $('#make').click(); };
  $('#make').onclick = async () => {
    const name = $('#name').value.trim(); $('#makeErr').textContent = '';
    if (!name) { $('#makeErr').textContent = 'Add a name first.'; return; }
    $('#make').disabled = true;
    try {
      const r = await api('POST', { name }); const d = await r.json();
      if (!r.ok) throw new Error();
      const url = linkFor(d.ticket.id);
      $('#madeFor').textContent = 'Ticket for ' + d.ticket.name; $('#madeUrl').textContent = url; $('#openLink').href = url; $('#made').classList.add('show');
      copyBtn($('#copy'), url, 'Copy link');
      $('#name').value = ''; loadLog().catch(() => {});
    } catch { $('#makeErr').textContent = 'Could not make the ticket. Try again.'; }
    finally { $('#make').disabled = false; }
  };
  if (key) { $('#key').value = key; enter(); }
})();
</script>
</body>
</html>
